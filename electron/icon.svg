<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- AV Control app icon: the nav's RadioTower glyph (lucide) on a graphite tile, with the
       broadcast point in the panel's LIVE red. Source for scripts/make-icons.mjs (48 px and up;
       icon-small.svg covers the smaller sizes). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b31"/>
      <stop offset="1" stop-color="#0b0b0d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.36">
      <stop offset="0" stop-color="#f0443a" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#f0443a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect id="bg" x="16" y="16" width="480" height="480" rx="108" fill="url(#tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#glow)"/>
  <rect x="17" y="17" width="478" height="478" rx="107" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <g transform="translate(80 76) scale(14.667)" fill="none" stroke="#fafafa" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.9 16.1C1 12.2 1 5.8 4.9 1.9" stroke-opacity="0.6"/>
    <path d="M19.1 1.9a9.96 9.96 0 0 1 0 14.1" stroke-opacity="0.6"/>
    <path d="M7.8 4.7a6 6 0 0 0-.8 7.5"/>
    <path d="M16.2 4.8c2 2 2.26 5.11.8 7.47"/>
    <path d="M9.5 18h5"/>
    <path d="m8 22 4-11 4 11"/>
    <circle cx="12" cy="9" r="1.85" fill="#f0443a" stroke="#f0443a"/>
  </g>
</svg>
